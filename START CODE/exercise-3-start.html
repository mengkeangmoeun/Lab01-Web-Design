<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 3</title>
</head>
    <style>
.container{
    display: flex;
    flex-direction: column;
    gap: 1rem;
    min-height: 100vh;
    padding: 1rem;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: bold;
    color: white;

}
.content{
    display: flex;
    flex-direction: row;
    flex-grow: 1;
    gap: 1rem;
}
header{
    background-color: #1e90ff;
    box-shadow: #0077ea;
    padding: 1rem;
    height: 50px;
}
main{
    flex-grow: 1;
    background-color: #3cb371;
    box-shadow: #2f8d59;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

.sidebar{
    background-color: #ff6347;
    box-shadow: #e02200;
}
footer{
    background-color: #4169e1;
    height: 50px;
    padding: 1rem;
}
header,main,footer,
.sidebar,.item{
    border-radius: 0.5rem;
    padding: 1rem;
}

.items{
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 1rem;
}
.item{
    background-color: #2f8d59;
    box-shadow: #226741;
    height: 5rem;
    width: 4rem;
    display: flex;
    justify-content: center;
    align-items: center;
}
    </style>
<body>

    <div class="container">
        <header class="header">header</header>

        <div class="content">
            <main>
            <h3>main</h3>
            <div class="items">
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
            </div>
        </main>
        
            <div class="sidebar">sidebar</div>
        </div>
            <footer class="footer">footer</footer>
    </div>

</body>
</html>
