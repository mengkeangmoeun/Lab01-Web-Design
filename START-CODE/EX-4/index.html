<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAHSBOARD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="title">Dashboard</h1>
    <div class="container">
        <!-- LARGE CARD -->
        <div class="card large">
            <div>
                <p class="label">Weekly Visitors</p>
                <p class="big">24,580</p>
                <p class="small">+12% from last week</p>
            </div>
            <div class="bars">
                <span style="height: 40%;"></span>
                <span style="height: 65%;"></span>
                <span style="height: 50%;"></span>
                <span style="height: 85%;"></span>
                <span style="height: 60%;"></span>
                <span style="height: 95%;"></span>
                <span style="height: 75%;"></span>
            </div>
        </div>
        <!-- CARD 2 -->
        <div class="card pink">
            <p class="label">Revenue</p>
            <p class="big">$8.4k</p>
        </div>

        <!-- CARD 3 -->
        <div class="card blue">
            <p class="label">New Users</p>
            <p class="big">1,200</p>
        </div>

        <!-- Wide Card -->
        <div class="card wide">
            <p class="label">Recent Activity</p>
            <ul class="list">
                <li> New Signup  <b> 2 min ago</b></li>
                <li> Order placed  <b> 10 min ago</b></li>
                <li> Review Posted  <b> 1 hr ago</b></li>
            </ul>
        </div>

        <!-- Tall Card -->
        <div class="card tall green">
            <p class="label">Goal Progress</p>
            <p class="big">78%</p>
        </div>
        <!-- Card -->
        <div class="card">
            <p class="label">Orderd</p>
            <p class="big">360</p>
        </div>
        <!-- Tall Card -->
        <div class="card">
            <p class="label">Rating</p>
            <p class="big">4.9</p>
        </div>
    </div>
</body>
</html>
